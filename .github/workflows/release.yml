name: Release

# Si avvia quando pubblichi un tag di versione (es. v1.1.0): costruisce lo zip portatile e le
# impronte SHA-256 e li allega alla release di GitHub.
# Gli eseguibili non sono firmati: vedi docs/SIGNING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Dipendenze di build
        run: python -m pip install -r requirements-build.txt

      - name: Controlla che il tag coincida con la versione dell'app
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Select-String -Path modules/version.js -Pattern 'BB_VERSION="([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Il tag ${{ github.ref_name }} non coincide con modules/version.js ($v)" }

      - name: Build (programma e zip portatile)
        run: python tools/build_exe.py

      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BlaBla-*-portable.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: BlaBla-build
          path: |
            dist/BlaBla-*-portable.zip
            dist/SHA256SUMS.txt
